{{ if .Values.cicap.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.cicap.serviceNameOverride | default (include "dev-backends.cicap.fullname" . | trunc 52 | trimSuffix "-") }}
  namespace: {{ include  "dev-backends.namespace" . }}
spec:
  ports:
  - name: tcp-cicap
    port: {{ .Values.cicap.port }}
    protocol: TCP
    targetPort: tcp-cicap
  selector:
    app.kubernetes.io/instance: dev-backends
    app.kubernetes.io/name: cicap
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "dev-backends.cicap.fullname" . }}
  namespace: {{ include  "dev-backends.namespace" . }}
  labels:
    app.kubernetes.io/instance: dev-backends
    app.kubernetes.io/name: cicap
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: dev-backends
      app.kubernetes.io/name: cicap
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dev-backends
        app.kubernetes.io/name: cicap
      annotations:
        configmap/hash: {{ include (print $.Template.BasePath "/cicap-configmap.yaml") . | sha256sum }}
    spec:
      containers:
      - name: cicap
        image: "{{ .Values.cicap.registry }}/{{ .Values.cicap.repository }}:{{ .Values.cicap.tag }}"
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            echo 'Waiting for clamd on 127.0.0.1:3310 (the first start downloads the virus database)...';
            i=0;
            until nc -z 127.0.0.1 3310; do
              i=$((i + 5));
              if [ $((i % 60)) -eq 0 ]; then
                echo "Clamd not responding yet after ${i}s, check the clamd container logs: kubectl logs <pod> -c clamd";
              fi;
              sleep 5;
            done;
            exec /var/lib/clamav/bin/c-icap -N -D
        ports:
        - containerPort: {{ .Values.cicap.port }}
          name: tcp-cicap
        volumeMounts:
        - name: config
          mountPath: /var/lib/clamav/etc/c-icap.conf
          subPath: c-icap.conf
          readOnly: true
        - name: config
          mountPath: /var/lib/clamav/etc/virus_scan.conf
          subPath: virus_scan.conf
          readOnly: true
        - name: config
          mountPath: /var/lib/clamav/etc/clamd_mod.conf
          subPath: clamd_mod.conf
          readOnly: true
        # clamd_mod sends the path of the c-icap temporary file to clamd
        # (zSCAN), so clamd must see the same files
        - name: scan-tmp
          mountPath: /var/tmp
        resources:
          {{- toYaml .Values.cicap.resources | nindent 10 }}
        readinessProbe:
          tcpSocket:
            port: tcp-cicap
          initialDelaySeconds: 30
          periodSeconds: 10
      - name: clamd
        image: "{{ .Values.cicap.clamd.image }}"
        imagePullPolicy: IfNotPresent
        env:
        # Tune the clamd.conf of the image instead of replacing it: the image
        # entrypoint waits for the clamd local socket declared there, and clamd
        # can not log to /dev/stdout (symlink)
        - name: CLAMD_CONF_StreamMaxLength
          value: {{ .Values.cicap.streamMaxLength | quote }}
        {{- with .Values.cicap.clamd.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: 3310
          name: tcp-clamd
        volumeMounts:
        - name: clamav-db
          mountPath: /var/lib/clamav
        - name: scan-tmp
          mountPath: /var/tmp
        resources:
          {{- toYaml .Values.cicap.clamd.resources | nindent 10 }}
        readinessProbe:
          tcpSocket:
            port: tcp-clamd
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: {{ template "dev-backends.cicap.fullname" . }}
      - name: clamav-db
        emptyDir: {}
      - name: scan-tmp
        emptyDir: {}
{{ end }}
