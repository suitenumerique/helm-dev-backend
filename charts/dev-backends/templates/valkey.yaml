{{ if .Values.valkey.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.valkey.serviceNameOverride | default (include "dev-backends.valkey.fullname" . | trunc 52 | trimSuffix "-") }}
  namespace: {{ include  "dev-backends.namespace" . }}
spec:
  ports:
  - name: tcp-valkey
    port: 6379
    protocol: TCP
    targetPort: tcp-valkey
  selector:
    app.kubernetes.io/instance: dev-backends
    app.kubernetes.io/name: valkey
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "dev-backends.valkey.fullname" . }}
  namespace: {{ include  "dev-backends.namespace" . }}
  labels:
    app.kubernetes.io/instance: dev-backends
    app.kubernetes.io/name: valkey
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: dev-backends
      app.kubernetes.io/name: valkey
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dev-backends
        app.kubernetes.io/name: valkey
      annotations:
        configmap/hash: {{ include (print $.Template.BasePath "/valkey-secret.yaml") . | sha256sum }}
    spec:
      containers:
      - name: valkey
        args:
          - valkey-server
          - /usr/local/etc/valkey/valkey.conf
        image: {{ .Values.valkey.image | quote }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: tcp-valkey
        volumeMounts:
        - name: valkey
          mountPath: "/usr/local/etc/valkey"
          readOnly: true
      volumes:
      - name: valkey
        secret:
          secretName: {{ template "dev-backends.valkey.fullname" . }}
{{ end }}
