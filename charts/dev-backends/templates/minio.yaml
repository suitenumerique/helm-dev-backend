{{ if .Values.minio.enabled }}
{{- if .Values.minio.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "dev-backends.minio.fullname" . }}-api
  namespace: {{ include  "dev-backends.namespace" . }}
  {{- with .Values.minio.ingress.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  rules:
  - host: "{{ .Values.minio.ingress.hostname }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.minio.serviceNameOverride | default (include "dev-backends.minio.fullname" . | trunc 52 | trimSuffix "-") }}
            port:
              number: {{ .Values.minio.api.port }}
  {{ if .Values.minio.ingress.tls.enabled }}
  tls:
  - hosts:
    - "{{ .Values.minio.ingress.hostname }}"
    secretName: "{{ .Values.minio.ingress.tls.secretName }}"
  {{- end }}
{{- end }}
{{- if .Values.minio.consoleIngress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "dev-backends.minio.fullname" . }}-console
  {{- with .Values.minio.consoleIngress.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  namespace: {{ include  "dev-backends.namespace" . }}
spec:
  rules:
  - host: "{{ .Values.minio.consoleIngress.hostname }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.minio.serviceNameOverride | default (include "dev-backends.minio.fullname" . | trunc 52 | trimSuffix "-") }}
            port:
              number: {{ .Values.minio.console.port }}
  {{ if .Values.minio.consoleIngress.tls.enabled }}
  tls:
  - hosts:
    - "{{ .Values.minio.consoleIngress.hostname }}"
    secretName: "{{ .Values.minio.consoleIngress.tls.secretName }}"
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.minio.serviceNameOverride | default (include "dev-backends.minio.fullname" . | trunc 52 | trimSuffix "-") }}
  namespace: {{ include  "dev-backends.namespace" . }}
spec:
  ports:
  - name: client
    port: {{ .Values.minio.api.port }}
    protocol: TCP
    targetPort: {{ .Values.minio.api.port }}
  - name: console
    port: {{ .Values.minio.console.port }}
    protocol: TCP
    targetPort: {{ .Values.minio.console.port }}
  selector:
    app.kubernetes.io/instance: dev-backends
    app.kubernetes.io/name: minio
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "dev-backends.minio.fullname" . }}
  namespace: {{ include  "dev-backends.namespace" . }}
  labels:
    app.kubernetes.io/instance: dev-backends
    app.kubernetes.io/name: minio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: dev-backends
      app.kubernetes.io/name: minio
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dev-backends
        app.kubernetes.io/name: minio
      annotations:
        configmap/hash: {{ include (print $.Template.BasePath "/minio-secret.yaml") . | sha256sum }}
    spec:
      containers:
      - name: minio
        command:
          - /bin/sh
          - -c
          - |
            minio server --address :{{ .Values.minio.api.port }} --console-address :{{ .Values.minio.console.port }} /data
        env:
          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: {{ .Values.minio.serviceNameOverride | default (include "dev-backends.minio.fullname" . | trunc 52 | trimSuffix "-") }}
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                key: username
                name: {{ .Values.minio.serviceNameOverride | default (include "dev-backends.minio.fullname" . | trunc 52 | trimSuffix "-") }}
          - name: MINIO_API_CORS_ALLOW_ORIGIN
            value: "*"
        image: {{ .Values.minio.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.minio.api.port }}
          name: client
        - containerPort: {{ .Values.minio.console.port }}
          name: console
        volumeMounts:
        - mountPath: /data
          name: data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.minio.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "dev-backends.minio.fullname" . }}
  namespace: {{ include  "dev-backends.namespace" . }}
spec:
  ttlSecondsAfterFinished: 0
  template:
    spec:
      initContainers:
      - name: wait-for-minio
        image: busybox:1.35
        command:
          - /bin/sh
          - -c
          - |
            echo "Attente de MinIO sur minio:{{ .Values.minio.api.port }}..."
            until nc -z {{ .Values.minio.serviceNameOverride | default (include "dev-backends.minio.fullname" . | trunc 52 | trimSuffix "-") }} {{ .Values.minio.api.port }}; do
              echo "MinIO pas encore prêt, attente 5s..."
              sleep 5
            done
            echo "MinIO est accessible !"
      containers:
      - name: mc
        image: minio/mc
        command:
          - /bin/sh
          - -c
          - |
            /usr/bin/mc alias set local-server http://{{ .Values.minio.serviceNameOverride | default (include "dev-backends.minio.fullname" . | trunc 52 | trimSuffix "-") }}:{{ .Values.minio.api.port }} {{ .Values.minio.username }} {{ .Values.minio.password }} && \
            /usr/bin/mc ls local-server/{{ .Values.minio.bucket }}
            if [ $? -eq 0 ]; then
              echo "Bucket already present"
              exit 0
            fi
            echo "Create bucket"
            /usr/bin/mc mb local-server/{{ .Values.minio.bucket }}
            enable_versioning={{ .Values.minio.versioning }}
            if [ "$enable_versioning" = "true" ]; then
              /usr/bin/mc version enable local-server/{{ .Values.minio.bucket }}
              echo "Versioning enabled"
            fi
            exit 0
      restartPolicy: Never
  backoffLimit: 1
{{ end }}
