#namespaceOverride: toto
#nameOverride: toto
#fullnameOverride: toto

postgres:
  enabled: false
  name: postgres
  #serviceNameOverride: postgres
  image: postgres:16-alpine
  username: dinum
  password: pass
  database: dinum
  size: 1Gi

redis:
  enabled: false
  name: redis
  #serviceNameOverride: redis
  image: redis:8.2-alpine
  #username: user
  #password: pass

minio:
  enabled: false
  image: minio/minio
  name: minio
  #serviceNameOverride: minio
  ingress:
    enabled: false
    hostname: minio.127.0.0.1.nip.io
    annotations: {}
    tls:
      enabled: false
      secretName: minio-tls
  consoleIngress:
    enabled: false
    hostname: minio-console.127.0.0.1.nip.io
    annotations: {}
    tls:
      enabled: false
      secretName: minio-tls
  api:
    port: 9000
  console:
    port: 9001
  username: dinum
  password: password
  bucket: dinum
  size: 1Gi
  versioning: false

keycloak:
  enabled: false
  image: quay.io/keycloak/keycloak:20.0.1
  name: keycloak
  #serviceNameOverride: keycloak
  hostname: keycloak.127.0.0.1.nip.io
  # Ingress annotations
  annotations: {}
  username: admin
  password: pass
  tls:
    enabled: false
    secretName: keycloak-tls
  db:
    username: dinum
    password: pass
    database: keycloak
    size: 1Gi
    image: postgres:16-alpine
  realm:
    name: dinum
    username: user
    password: pass
    email: user@example.com
dsproxy:
  aws_access_key: dinum
  aws_secret_key: password
  aws_url: http://release-name-dev-backend-minio
  aws_region: eu-east-1
  enabled: false
  replicas: 1
  resources: {}
  name: dsproxy
  envVars:
    <<: []
  #serviceNameOverride: dsproxy
  image: demarchenumerique/ds-proxy:v2.0.0-alpha.2
  command:
    - /bin/sh
    - "-c"
    - |
      /dsproxy/ds_proxy proxy --address=0.0.0.0:4444 --password-file /etc/dsproxy/PASSWORD \
      --salt "$SALT" --keyring-file /etc/dsproxy/keyring.toml --upstream-url ${AWS_URL} \
      --local-encryption-directory /var/tmp/local_encryption/ --aws-access-key ${AWS_ACCESS_KEY} \
      --aws-secret-key ${AWS_SECRET_KEY} --aws-region ${AWS_REGION}
  #username: user
  #password: pass
  ingress:
    enabled: false
    hostname: dsproxy.127.0.0.1.nip.io
    annotations: {}
    tls:
      enabled: false
      secretName: dsproxy-tls
  localSecret:
    enabled: false
